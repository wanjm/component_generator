name: component_generator
description: >-
  Annotated HTTP client code generation (REST), optional table/widget helpers,
  and HTTP/1.1 and HTTP/2 client bases for Dart.
version: 0.1.2
repository: https://github.com/wanjm/component_generator
topics:
  - codegen
  - build-runner
  - http

environment:
  sdk: ^3.0.0

dependencies:
  component_set: ^0.1.2
  path: ^1.9.0
  dart_style: ^3.0.0
  analyzer: ">=8.4.1 <14.0.0"
  build: ^4.0.0
  source_gen: ^4.0.0
dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  build_runner: ^2.3.2
